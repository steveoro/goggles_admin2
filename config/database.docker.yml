    pool: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>
    database: goggles
    structure_dump_flags: ["--skip-ssl"]
    structure_load_flags: ["--skip-ssl"]
  # Local SQLite DBs for Solid Queue (background/recurring jobs) and Solid Cable
  # (cross-process ActionCable broadcasts); they never touch the shared MySQL schema.
  queue:
    adapter: sqlite3
    pool: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>
    timeout: 5000
    database: storage/queue_staging.sqlite3
    migrations_paths: db/queue_migrate
    schema_format: ruby
    schema_dump: queue_schema.rb
  cable:
    adapter: sqlite3
    pool: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>
    timeout: 5000
    database: storage/cable_staging.sqlite3
    migrations_paths: db/cable_migrate
    schema_format: ruby
    schema_dump: cable_schema.rb
