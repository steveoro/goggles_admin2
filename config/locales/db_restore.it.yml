it:
  db_restore:
    nav: "Ripristino DB locale"
    layout:
      title: "Ripristino DB locale"
      brand: "Goggles Admin · ripristino DB locale"
    locked:
      title: "Ripristino del DB locale in corso"
      body: "Il run #%{id} sta sostituendo il database locale '%{database}' con un dump di produzione: le altre pagine tornano disponibili al termine."
      step: "Passo attuale: %{step}"
      open_progress: "Apri la pagina di avanzamento"
      no_token: "La pagina di avanzamento si apre solo nel browser che ha confermato il ripristino (o con il suo link)."
    lock:
      held: "Un altro run di ripristino (#%{id}) detiene il blocco."
    new:
      title: "Ripristina il DB locale"
      subtitle: "Sostituisce '%{database}' con un dump di produzione, mantenendo lo stato solo locale"
      intro: "La procedura sostituisce il database locale di sviluppo con un dump di produzione già presente su disco. Durante il caricamento ogni altra pagina risponde \"ripristino in corso\"."
      points:
        keeps: "Mantenuti: l'accesso (le sessioni stanno nel DB ops), l'URL dell'API (o quello del dump, a scelta), i dati ops (Outbox, segnalazioni, eventi) e i file del crawler."
        purges: "Svuotate: le righe di staging Data-Fix (tabelle data_import_*); i file di revisione restano, con i verdetti segnati come non aggiornati."
        stale: "Le migrazioni dell'engine più recenti del dump vengono segnalate con il comando da eseguire, mai eseguite dalla procedura."
        terminal: "Il prelievo del dump dalla produzione resta manuale; il dump si può anche caricare da terminale con db:rebuild (vedi docs/db_restore.md)."
      open_run: "Il run di ripristino #%{id} è aperto (%{status})."
      continue: "Continua"
      open_progress: "Apri la pagina di avanzamento"
      checks_title: "Prerequisiti"
      dumps_title: "Dump di produzione"
      no_dumps: "Nessun dump di produzione (production*.sql.bz2) in %{dirs}. Copiane prima uno dal server."
      dump_meta: "%{size} · %{time} · %{dir}"
      discard_reviews: "Scarta le %{count} revisioni Data-Fix in corso (le righe di staging vengono eliminate, gli abbinamenti diventano non aggiornati)"
      inspect: "Ispeziona il dump"
      blocked: "Risolvi prima i prerequisiti rifiutati."
      dirs_title: "Cartelle dei dump"
      dirs_label: "Cartelle in cui cercare i dump di produzione (una per riga)"
      dirs_hint: "Lascia vuoto per le predefinite (goggles_main/db/dump e db/dump di questa app). La copia di sicurezza va nella prima."
      dirs_save: "Salva le cartelle"
      history_title: "Ripristini precedenti"
    inspect:
      title: "Ripristino: ispezione del dump"
      subtitle: "Run #%{id}"
      running: "Lettura del dump (integrità, tabelle, versione dello schema): per un dump di produzione completo serve circa un minuto..."
      failed: "Questo dump non può essere ripristinato:"
      start_over: "Scegli un altro dump"
      results_title: "Ispezione"
      taken_at_source:
        footer: "(chiusura del dump)"
        mtime: "(ora del file: il dump non ha la riga 'Dump completed')"
      schema: "dump %{dump} · engine locale %{local}"
      snapshot_title: "Copia di sicurezza"
      snapshot_running: "Dump del DB locale attuale (mariadb-dump) e backup del DB ops in corso..."
      snapshot_done: "Copia di sicurezza: %{path}"
      ops_backup: "Backup del DB ops: %{path}"
      continue: "Prosegui con la conferma"
      snapshot_skipped: "Nessuna copia di sicurezza: un ripristino fallito si può correggere solo con un altro dump."
      snapshot_failed: "La copia di sicurezza è fallita: %{error}"
      snapshot_intro: "Un dump del DB locale attuale preso prima di eliminare qualsiasi cosa, per poter tornare indietro se il ripristino fallisce (serve spazio libero pari a 3 volte il dump)."
      snapshot: "Crea la copia di sicurezza"
      skip_ack: "Non mi serve poter tornare al DB locale attuale"
      skip: "Prosegui senza copia"
    confirm:
      title: "Ripristino: conferma"
      subtitle: "Run #%{id}"
      warning: "Confermando, il database locale '%{database}' viene eliminato e ricaricato dal dump. Le pagine rispondono \"ripristino in corso\" fino al termine dei passi finali."
      no_snapshot: "nessuna (saltata)"
      blocked: "Ora un prerequisito è rifiutato: il ripristino non può partire."
      api_title: "URL dell'API dopo il ripristino"
      api_keep: "Mantieni quello attuale:"
      api_dump: "Usa quello del dump:"
      api_dump_unknown: "(non trovato nel dump)"
      mode_title: "Caricamento"
      mode_wizard: "Caricalo dalla procedura (in streaming, con avanzamento)"
      mode_terminal: "Lo carico io da terminale (la procedura attende, poi esegue i passi finali):"
      type_name: "Scrivi il nome del database (%{database}) per confermare"
      submit: "Ripristina %{database} ora"
    show:
      title: "Ripristino di %{database}"
      subtitle: "Run #%{id} · %{dump}"
      done: "Il run è terminato (%{status})."
      open_result: "Apri il risultato"
      interrupted: "Il ripristino si è interrotto dopo l'eliminazione del DB locale: riprendi il caricamento, carica la copia di sicurezza o abbandona il run."
      stalled: "Nessun avanzamento da un po': il processo che esegue il ripristino probabilmente si è fermato. Riprendi il caricamento, carica la copia di sicurezza o abbandona il run."
      resume: "Riprendi dal caricamento"
      resume_confirm: "Eliminare di nuovo il DB locale e ricaricare il dump?"
      load_snapshot: "Carica la copia di sicurezza"
      load_snapshot_confirm: "Eliminare il DB locale e caricare la copia di sicurezza (lo stato prima del ripristino)?"
      snapshot_terminal: "Oppure carica la copia di sicurezza da terminale:"
      terminal_intro: "Carica ora il dump da un terminale, poi torna qui e premi il pulsante qui sotto:"
      terminal_done: "Caricamento fatto, esegui i passi finali"
      progress: "Avanzamento del ripristino"
      keep_open: "Tieni aperta questa pagina: si aggiorna ogni 2 secondi. Le altre pagine mostrano \"ripristino in corso\" fino al termine dei passi finali."
      abandon_title: "Abbandona questo run"
      abandon_intro: "Rilascia il blocco senza completare il ripristino: il DB locale può essere vuoto o caricato a metà (carica poi la copia di sicurezza o un altro dump). Scrivi il nome del database:"
      abandon_label: "Nome del database"
      abandon: "Abbandona"
      bookmark: "Link della pagina di avanzamento (solo locale):"
      bookmark_hidden: "Il link con il token di avanzamento è stato mostrato alla conferma del ripristino (questo browser può aprire la pagina per 24 ore)."
    result:
      title: "Ripristino #%{id}"
      db_sync: "Apri Sincronia DB"
      new: "Procedura di ripristino"
      headline:
        finished: "Ripristino completato (%{source})."
        failed: "Ripristino fallito prima di toccare il DB locale."
        cancelled: "Ripristino annullato o abbandonato."
        other: "Ripristino %{status}."
      loaded_from:
        dump: "caricato il dump di produzione"
        snapshot: "riportato alla copia di sicurezza"
        terminal: "caricato da terminale"
        none: "nulla caricato"
      drift_unknown: "Nessun controllo dopo il ripristino salvato (vedi Sincronia DB)."
      api_url:
        kept: "mantenuto (%{url})"
        dump: "preso dal dump"
        none: "nulla da mantenere"
      jwt:
        applied: "il tuo token API è stato riapplicato (nessun nuovo accesso necessario)"
        user_missing: "il tuo utente non è nel dump: accedi di nuovo"
        none: "nessun token API da riapplicare"
      staging: "%{count} righe di staging eliminate"
      pending_migrations: "%{count} migrazioni dell'engine più recenti del dump non sono applicate (%{versions}). Eseguile da goggles_main, poi riavvia admin2:"
      scripts_after_dump: "%{count} script dell'Outbox sono stati inviati dopo la creazione del dump (%{files}): il DB locale non li contiene finché non si ripristina un dump più recente (nessuna riesecuzione in questa versione)."
      rollback: "Copia di sicurezza: %{path}. Per caricarla da terminale:"
    progress:
      not_local: "La pagina di avanzamento risponde solo alle richieste locali."
      bad_token: "Token di avanzamento errato o mancante: apri il link mostrato alla conferma del ripristino."
      refused_title: "Pagina di avanzamento non disponibile"
    actions:
      cancel: "Annulla"
      cancel_confirm: "Annullare questo run di ripristino? Non è ancora stato modificato nulla."
      restore: "Ripristina DB locale..."
