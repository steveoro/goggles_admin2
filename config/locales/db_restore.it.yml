        integrity: "controllo di integrità bzip2 fallito (%{detail})"
        unreadable: "il dump non si può decomprimere (%{detail})"
        not_production: "l'intestazione non indica un dump di produzione ('%{detail}')"
        missing_tables: "tabelle principali mancanti: %{detail}"
        no_schema_version: "nessuna riga schema_migrations nel dump"
