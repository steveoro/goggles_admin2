      cancelled: "annullato"
      abandoned: "abbandonato"
    checks:
      environment:
        label: "Ambiente di sviluppo"
        refused: "L'app gira nell'ambiente '%{detail}': il ripristino è permesso solo in development."
        hint: "%{detail}"
      host:
        label: "Server MySQL locale"
        refused: "L'host del database è '%{detail}': sono ammessi solo il socket locale, localhost o 127.0.0.1."
        hint: "%{detail}"
      database_name:
        label: "Database di sviluppo"
        refused: "Il database '%{detail}' ha un nome di produzione o non è la voce development di config/database.yml."
        hint: "%{detail}"
      ops:
        label: "DB ops pronto"
        refused: "Il DB ops è %{detail}: contiene il blocco e lo storico (esegui bin/rails ops:prepare)."
        hint: "%{detail}"
      other_run:
        label: "Nessun altro run di ripristino aperto"
        refused: "Il run %{detail} è ancora aperto: continualo o annullalo prima."
        hint: "%{detail}"
      outbox:
        label: "Outbox vuota"
        refused: "%{detail} script SQL ancora in attesa, trattenuti, in invio, inviati, in dubbio o falliti: inviali, ritirali o scartali prima nell'Outbox."
        hint: "%{detail}"
      push_run:
        label: "Nessun invio in corso"
        refused: "L'invio %{detail} è in corso."
        hint: "%{detail}"
      blocking_jobs:
        label: "Nessun job di commit, manutenzione o controllo in esecuzione o in coda"
        refused: "In esecuzione o in coda: %{detail}. Lascialo prima terminare."
        queued_item: "in coda: %{job}"
        hint: "%{detail}"
      reviews:
        label: "Revisioni Data-Fix in corso"
        refused: "%{detail} sorgenti hanno file di fase o righe di staging: spunta \"scarta\" per proseguire."
        hint: "%{detail} sorgenti perderanno le righe di staging; i loro abbinamenti diventano non aggiornati."
        staging_rows: "%{count} righe di staging"
      queue_db:
        label: "Code dei job"
        refused: "Il DB di Solid Queue non è leggibile."
        hint: "Il DB di Solid Queue non è leggibile: le code non possono essere sospese (il DB delle code è preparato?)."
      drain:
        label: "Job in esecuzione terminati"
        refused: "Ancora in esecuzione dopo l'attesa: %{detail}."
        hint: "%{detail}"
      running_jobs:
        label: "Altri job in esecuzione"
        refused: "%{detail}"
        hint: "In esecuzione ora: %{detail}. Il caricamento sospende le code e li attende fino a 10 minuti."
    inspection:
      errors:
