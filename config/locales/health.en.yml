    checks:
      meetings:
        no_results:
          unflagged:
            title: "Meetings without results, no source"
            finding: "Meeting %{id} (%{date}) %{description}: no results, not cancelled"
            howto: "The meeting took place (its date is past) but it has no individual nor relay results, it isn't flagged as cancelled and no source file waits for it. If the results were never published, ignore it with a note (\"no results published\"). If it was cancelled, use \"Flag cancelled\": the preview shows the SQL, then the meeting (and its calendar) are flagged locally and a numbered SQL script is written for the Outbox."
          source_on_disk:
            title: "Meetings without results, source on disk"
            finding: "Meeting %{id} (%{date}) %{description}: results waiting in %{file}"
            howto: "A source file, Data-Fix phase files or a commit script exist for this meeting's FIN event but its results are not in the DB yet. Resume the Data-Fix review (or push the pending script) to import them."
        cancel_mismatch:
          title: "Cancelled flags out of step"
          finding: "Meeting %{id} (%{date}) %{description}: meeting and calendar 'cancelled' flags differ"
          howto: "The meeting and its calendar disagree on 'cancelled', or a cancelled meeting has results. When the side not flagged yet has no results, \"Flag cancelled\" aligns it. When a cancelled meeting (or calendar) has results, it was probably flagged by mistake: clear the flag from the Meetings or Calendars grid (edit row) after checking the meeting on the FIN site."
        no_events:
          title: "Meetings without events"
          finding: "Meeting %{id} (%{date}) %{description}: no events"
          howto: "The meeting has no events (its structure was never imported). Open the structure review when a source file exists; otherwise extract the manifest from the Season board, or ignore it with a note for an old meeting that will never be completed."
        results_flag:
          title: "Results flag not set"
          finding: "Season %{id}: %{count} meetings have results but 'results acquired' is off"
          howto: "These meetings have results but their 'results_acquired' flag is still false (the Season board and the import checks read it). Run the Season board backfill for the season: it flags every meeting with results (simulate first, then simulate=0 writes the numbered script for the Outbox)."
      calendars:
        unlinked:
          title: "Calendar rows never imported"
          finding: "Calendar %{id} (%{date}) %{name}: no meeting linked"
          finding_duplicate: "FIN event %{fin_event_id} is used by calendars %{ids}"
          finding_same_code: "Calendar %{id} (%{date}) %{name}: not linked to meeting %{meetings} (same code)"
          howto: "The calendar row (not cancelled) points to no meeting, or to a meeting that doesn't exist: the meeting was never imported. Flag it cancelled when the event didn't take place, link it from the Season board (current season), or ignore it with a note. When a meeting of the season has the same code (\"not linked to meeting N\"), the meeting was imported and only the calendar's meeting_id is missing: set it from the Calendars grid. A FIN event id shared by several calendar rows usually means a duplicated calendar: keep one and fix the others from the Calendars grid."
      badges:
        duplicate:
          sure:
            title: "Duplicate badges (sure)"
            finding: "%{name} (%{year}): %{count} badges to merge"
            howto: "The same swimmer has several badges in the season with the same team (or teams sharing a meeting). Merge them with the rake command below (check it first with 'check:badge src= dest='), then re-run the badges group."
          possible:
            title: "Duplicate badges (possible)"
            finding: "%{name} (%{year}): %{count} badges with similar team names"
            howto: "The same swimmer has badges with teams whose names are similar: either the teams are the same club (merge the teams first, see the team duplicates section) or the swimmer really changed team. Ignore it with a note when both badges are right."
        relay_category:
          title: "Badges on a relay category"
          finding: "Badge %{id} of %{name} on relay category %{category}"
          howto: "Badges must carry an individual category. Merge the badge into the swimmer's other badge, or let 'merge:badge src=<id> autofix=1' compute the right category from the year of birth."
      teams:
        possible_duplicates:
          title: "Possible team duplicates"
          finding: "Similar teams: %{names}"
          howto: "Teams with similar names share a swimmer with several badges. Check them with 'check:team src= dest=' (the destination is the older row) and merge them with 'merge:team' when they are the same club; ignore otherwise."
      swimmers:
        possible_duplicates:
          title: "Possible swimmer duplicates"
          finding: "%{name1} (%{year1}) / %{name2} (%{year2})"
          howto: "Two swimmers with the same name and a different year of birth, or with very similar names in the same team, gender and year of birth. Check them with 'check:swimmer src= dest=' (the destination is the older row) and merge them with 'merge:swimmer' when they are the same person; ignore with a note otherwise."
      results:
        duplicates:
          title: "Duplicate results"
          finding: "Meeting %{id} %{description}: %{total} duplicate rows"
          howto: "The meeting holds duplicate results (same swimmer and program, laps, relay swimmers or relay results). The rake command previews the duplicates and, after a confirmation, writes the deletion script (lowest ids are kept)."
          null_swimmers_first: "This meeting also has results with a NULL swimmer: fix them first (see the null swimmers section). The duplicate report groups the NULL swimmers together, but the deletion script never matches them."
        null_swimmers:
          title: "Results without swimmer"
          finding: "Meeting %{id} %{description}: %{mirs} MIRs and %{mrss} relay swimmers without swimmer"
          howto: "Some results have a NULL swimmer_id. The rake command restores it from the badge when the badge exists and has a swimmer (it simulates by default, writing the script for review); the rows without a usable badge must be fixed by hand."
        dup_mir_per_badge:
          title: "Several results per badge and program"
          finding: "Meeting %{id} %{description}: %{count} badges with more than one result in a program"
          howto: "A badge has more than one individual result in the same program: usually a wrong badge assignment or a mis-aligned import. List them with the rake command, then fix them with the duplicate results tools or by hand."
      season:
        setup:
          title: "Season setup"
          finding: "Season %{id}: %{categories} categories, %{timings} standard timings"
          howto: "The season has no categories or no standard timings. For a current or upcoming season follow docs/HOWTO_prepare_new_season_at_championship_start.md; for an old closed season this is informational only."
