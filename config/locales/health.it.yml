    checks:
      meetings:
        no_results:
          unflagged:
            title: "Meeting senza risultati, nessuna sorgente"
            finding: "Meeting %{id} (%{date}) %{description}: nessun risultato, non annullato"
            howto: "Il meeting si è svolto (la data è passata) ma non ha risultati individuali né di staffetta, non è segnato annullato e nessun file sorgente lo attende. Se i risultati non sono mai stati pubblicati, ignoralo con una nota (\"risultati mai pubblicati\"). Se è stato annullato, usa \"Segna annullato\": l'anteprima mostra l'SQL, poi il meeting (e il suo calendario) vengono segnati in locale e viene scritto uno script SQL numerato per l'Outbox."
          source_on_disk:
            title: "Meeting senza risultati, sorgente su disco"
            finding: "Meeting %{id} (%{date}) %{description}: risultati in attesa in %{file}"
            howto: "Per l'evento FIN di questo meeting esistono un file sorgente, file di fase Data-Fix o uno script di commit, ma i risultati non sono ancora nel DB. Riprendi la revisione Data-Fix (o invia lo script in attesa) per importarli."
        cancel_mismatch:
          title: "Flag di annullamento non allineati"
          finding: "Meeting %{id} (%{date}) %{description}: i flag 'annullato' di meeting e calendario differiscono"
          howto: "Il meeting e il suo calendario non concordano su 'annullato', oppure un meeting annullato ha risultati. Se il lato non ancora segnato non ha risultati, \"Segna annullato\" li allinea. Se un meeting (o calendario) annullato ha risultati, probabilmente è stato segnato per errore: togli il flag dalla griglia Meeting o Calendari (modifica riga) dopo aver verificato il meeting sul sito FIN."
        no_events:
          title: "Meeting senza gare"
          finding: "Meeting %{id} (%{date}) %{description}: nessuna gara"
          howto: "Il meeting non ha gare (la struttura non è mai stata importata). Apri la revisione della struttura se esiste un file sorgente; altrimenti estrai la locandina dal Season board, oppure ignoralo con una nota per un vecchio meeting che non sarà mai completato."
        results_flag:
          title: "Flag risultati non impostato"
          finding: "Stagione %{id}: %{count} meeting hanno risultati ma 'risultati acquisiti' è spento"
          howto: "Questi meeting hanno risultati ma il flag 'results_acquired' è ancora falso (lo leggono il Season board e i controlli di import). Esegui il backfill del Season board per la stagione: segna ogni meeting con risultati (prima in simulazione, poi simulate=0 scrive lo script numerato per l'Outbox)."
      calendars:
        unlinked:
          title: "Righe di calendario mai importate"
          finding: "Calendario %{id} (%{date}) %{name}: nessun meeting collegato"
          finding_duplicate: "L'evento FIN %{fin_event_id} è usato dai calendari %{ids}"
          finding_same_code: "Calendario %{id} (%{date}) %{name}: non collegato al meeting %{meetings} (stesso codice)"
          howto: "La riga di calendario (non annullata) non punta a nessun meeting, o a un meeting che non esiste: il meeting non è mai stato importato. Segnala annullata se l'evento non si è svolto, collegala dal Season board (stagione in corso) o ignorala con una nota. Se un meeting della stagione ha lo stesso codice (\"non collegato al meeting N\"), il meeting è stato importato e manca solo il meeting_id del calendario: impostalo dalla griglia Calendari. Un ID evento FIN condiviso da più righe di calendario indica di solito un calendario duplicato: tienine una e correggi le altre dalla griglia Calendari."
      badges:
        duplicate:
          sure:
            title: "Badge duplicati (certi)"
            finding: "%{name} (%{year}): %{count} badge da unire"
            howto: "Lo stesso nuotatore ha più badge nella stagione con la stessa squadra (o squadre che condividono un meeting). Uniscili con il comando rake qui sotto (verificalo prima con 'check:badge src= dest='), poi riesegui il gruppo badge."
          possible:
            title: "Badge duplicati (possibili)"
            finding: "%{name} (%{year}): %{count} badge con nomi di squadra simili"
            howto: "Lo stesso nuotatore ha badge con squadre dai nomi simili: o le squadre sono la stessa società (unisci prima le squadre, vedi la sezione squadre duplicate) o il nuotatore ha davvero cambiato squadra. Ignora con una nota se entrambi i badge sono corretti."
        relay_category:
          title: "Badge su una categoria staffetta"
          finding: "Badge %{id} di %{name} sulla categoria staffetta %{category}"
          howto: "I badge devono avere una categoria individuale. Unisci il badge all'altro badge del nuotatore, oppure lascia che 'merge:badge src=<id> autofix=1' calcoli la categoria giusta dall'anno di nascita."
      teams:
        possible_duplicates:
          title: "Possibili squadre duplicate"
          finding: "Squadre simili: %{names}"
          howto: "Squadre con nomi simili condividono un nuotatore con più badge. Verificale con 'check:team src= dest=' (la destinazione è la riga più vecchia) e uniscile con 'merge:team' se sono la stessa società; altrimenti ignora."
      swimmers:
        possible_duplicates:
          title: "Possibili nuotatori duplicati"
          finding: "%{name1} (%{year1}) / %{name2} (%{year2})"
          howto: "Due nuotatori con lo stesso nome e un anno di nascita diverso, o con nomi molto simili nella stessa squadra, sesso e anno di nascita. Verificali con 'check:swimmer src= dest=' (la destinazione è la riga più vecchia) e uniscili con 'merge:swimmer' se sono la stessa persona; altrimenti ignora con una nota."
      results:
        duplicates:
          title: "Risultati duplicati"
          finding: "Meeting %{id} %{description}: %{total} righe duplicate"
          howto: "Il meeting contiene risultati duplicati (stesso nuotatore e programma, vasche, frazionisti o risultati di staffetta). Il comando rake mostra i duplicati e, dopo una conferma, scrive lo script di cancellazione (vengono tenuti gli id più bassi)."
          null_swimmers_first: "Questo meeting ha anche risultati con nuotatore NULL: correggili prima (vedi la sezione nuotatori nulli). Il report dei duplicati raggruppa insieme i nuotatori NULL, ma lo script di cancellazione non li intercetta mai."
        null_swimmers:
          title: "Risultati senza nuotatore"
          finding: "Meeting %{id} %{description}: %{mirs} risultati e %{mrss} frazionisti senza nuotatore"
          howto: "Alcuni risultati hanno swimmer_id NULL. Il comando rake lo ripristina dal badge quando il badge esiste e ha un nuotatore (di default simula, scrivendo lo script da rivedere); le righe senza un badge utilizzabile vanno corrette a mano."
        dup_mir_per_badge:
          title: "Più risultati per badge e programma"
          finding: "Meeting %{id} %{description}: %{count} badge con più di un risultato in un programma"
          howto: "Un badge ha più di un risultato individuale nello stesso programma: di solito un badge assegnato male o un import disallineato. Elencali con il comando rake, poi correggili con gli strumenti per i risultati duplicati o a mano."
      season:
        setup:
          title: "Preparazione stagione"
          finding: "Stagione %{id}: %{categories} categorie, %{timings} tempi base"
          howto: "La stagione non ha categorie o non ha tempi base. Per una stagione in corso o futura segui docs/HOWTO_prepare_new_season_at_championship_start.md; per una vecchia stagione chiusa è solo informativo."
