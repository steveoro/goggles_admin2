      partial_apply: "Partial apply: blocks 1-%{applied} of %{total} ran on the local DB and were registered in the Outbox as %{file}; block %{block} failed and nothing after it ran. Fix the cause, then start a new dry run: it plans what is left. Error: %{error}"
