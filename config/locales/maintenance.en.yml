      local_apply_failed: "The local apply failed (nothing was registered in the Outbox): %{error}"
      outbox_failed: "Applied on the local DB, but the Outbox registration failed (%{error}): the script is kept at %{path}; register it by hand."
      interrupted_apply: "Apply #%{id} of the same operation was interrupted: the local DB may already contain its change. This dry run reads the current data: check it before applying."
