      title: "Opens the operation form: a dry run comes first."
    commit_report:
      fixes: "Fixes for the season findings"
      fixes_none: "No open badge or duplicate finding for this commit."
      more: "All the season findings"
    operations:
      meeting_set_cancelled:
        title: "Flag a meeting cancelled"
        description: "Flags the meeting and/or its calendar as cancelled (refused when the meeting has results). If the meeting took place but its results were never published, ignore the finding with a note instead: the public site would show it as cancelled."
        fix_label: "Flag cancelled"
        label_meeting: "Flag meeting %{id} cancelled"
        label_calendar: "Flag calendar %{id} cancelled"
        errors:
          no_target: "Give a meeting or a calendar."
          meeting_not_found: "Meeting %{id} not found."
          calendar_not_found: "Calendar %{id} not found."
          other_meeting: "Calendar %{id} is not linked to meeting %{meeting_id}."
          has_results: "The meeting has results: it can't be flagged cancelled."
      badge_merge:
        title: "Merge badges"
        description: "Merges the source badge into the destination one (results, laps, relay swimmers, entries, reservations), or fixes a badge alone on a relay-only category (no destination). Same call as merge:badge."
        fix_label: "Merge badges"
        label: "Merge badge %{source} into %{dest}"
        label_fix: "Fix the category of badge %{id}"
        errors:
          checker: "The badge checker reported errors: set force or a keep_* option to go on."
      results_dedupe:
        title: "Delete duplicate results"
        description: "Deletes the duplicate results of one meeting (individual results, laps, relay swimmers, relay laps, relay results; the lowest id is kept). Same call as check:dup_mir_swimmers autofix=1."
        fix_label: "Delete duplicates"
        label: "Delete the duplicate results of meeting %{id}"
        label_season: "Delete the duplicate results of season %{id}"
        errors:
          null_swimmers_first: "The meeting has an open 'NULL swimmers' finding: fix the NULL swimmers first (the duplicate deletion never matches them)."
        warnings:
          timing_mismatch: "Some duplicate individual results have different timings: the deletion keeps the lowest id regardless of the timing."
          groups_capped: "%{count} duplicate groups: only the first ones are listed."
      results_null_swimmers_fix:
        title: "Fix NULL swimmers in results"
        description: "Restores the swimmer of the individual results and relay swimmers of one meeting having a NULL swimmer_id, from their badge (laps and relay laps follow). Same call as fix:nil_swimmers_in_results."
        fix_label: "Fix NULL swimmers"
        label: "Fix the NULL swimmers of meeting %{id}"
        label_season: "Fix the NULL swimmers of season %{id}"
        warnings:
          unfixable: "%{count} rows can't be fixed (no badge, missing badge or badge without swimmer): they are listed and never touched."
      ranks_recompute:
        title: "Recompute ranks"
        description: "Recomputes the individual and relay ranks of a meeting (or of a whole season) by timing. Offered after a duplicate deletion or a badge merge, never chained. Same code as recompute:ranks."
        fix_label: "Recompute ranks"
        label_meeting: "Recompute the ranks of meeting %{id}"
        label_season: "Recompute the ranks of season %{id}"
        errors:
          no_target: "Give a meeting or a season."
      season_board_backfill:
        title: "Season board backfill"
        description: "Links the season calendars to their FIN events and flags the meetings with results as 'results acquired', from the archived files. Same call as season_board:backfill."
        fix_label: "Run the backfill"
        label: "Backfill season %{id}"
        warnings:
          no_snapshot: "Not the Season board season: the FIN watcher snapshot is not used (calendars are resolved from the archived files only)."
      swimmer_merge:
        title: "Merge swimmers"
        description: "Merges the source swimmer into the destination one (badges, results, laps, links), then deletes the source. Same call as merge:swimmer."
        fix_label: "Merge swimmers"
        label: "Merge swimmer %{source} into %{dest}"
        errors:
          checker: "The swimmer checker reported errors: set force to go on."
      team_merge:
        title: "Merge teams"
        description: "Merges the source team into the destination one (affiliations, badges with their sub-merges, results, links), then deletes the source. Same call as merge:team."
        fix_label: "Merge teams"
        label: "Merge team %{source} into %{dest}"
      meeting_merge:
        title: "Merge meetings"
        description: "Merges a source meeting into a destination one of the same season (sessions, events, programs, results, laps, relays, team scores, calendar), then deletes the source. Same call as merge:meeting; after the apply the expected and final counts are checked."
        fix_label: "Merge meetings"
        label: "Merge meeting %{source} into %{dest}"
        errors:
          checker: "The meeting checker found errors: the merge is not feasible."
      meeting_team_fix:
        title: "Fix a team inside one meeting"
        description: "Moves every result of a wrong team to the right one inside a single meeting (individual and relay results, laps, badges, duplicates). Same calls as merge:team_in_1_meeting."
        fix_label: "Fix the team in the meeting"
        label: "Meeting %{meeting}: move team %{source} to team %{dest}"
        warnings:
          badge_pairs: "%{count} swimmers will have a badge on both teams: merge those badge pairs afterwards (badge.merge)."
      badge_team_fix:
        title: "Fix the team of badges"
        description: "Sets the right team on one or more badges (results, laps and relay results follow; entries and reservations are deleted). Refused when a swimmer already has a badge on the right team: merge the badges instead. Same calls as fix:team_in_badge."
        fix_label: "Fix the team of the badges"
        label: "Badges %{badges}: team %{team}"
        errors:
          no_badges: "Give at least one existing badge id."
        warnings:
          nuke: "Nuke team is on: every row linked to a reused team affiliation moves, not only these badges."
      badge_swimmer_fix:
        title: "Fix the swimmer of badges"
        description: "Sets the right swimmer on one or more badges (results, laps, relay swimmers, entries and reservations follow). Refused when the swimmer already has a badge for the same team and season: merge the badges instead. Same calls as fix:swimmer_in_badge."
        fix_label: "Fix the swimmer of the badges"
        label: "Badges %{badges}: swimmer %{swimmer}"
      meeting_purge:
        title: "Purge a meeting"
        description: "Deletes every row of a meeting bottom-up (results, programs, events, sessions, reservations, team scores, calendar and the meeting row), or only down to the programs. Same calls as purge:meeting."
        fix_label: "Purge the meeting"
        label: "Purge meeting %{id}"
      coded_names_normalize:
        title: "Normalize coded names"
        description: "Normalizes the meeting codes (with edition and edition type) and the swimming pool nick names with the shared goggles_db normalizers; pools whose new name already exists are skipped. Same calls as normalize:coded_names."
        fix_label: "Normalize coded names"
        label: "Normalize the coded names (limit %{limit})"
        warnings:
          duplicates: "Skipped pools (their new nick name already exists, fix them by hand): %{ids}"
      categories_clone:
        title: "Clone category types"
        description: "Clones the CategoryTypes missing in a destination season from a source season, optionally deleting some codes first. A repair of the season-start checklist only: the goggles_db data migration creates them on deploy. Same calls as import:categories."
        fix_label: "Clone the categories"
        label: "Clone the categories of season %{source} into season %{dest}"
      standard_timings_import:
        title: "Import standard timings"
        description: "Imports the standard timings of a season from the FIN source file in crawler/data/standard_timings/<season>/. The script goes to results.new/<season>/ and stays held until the remote season exists (season-start checklist, step 6)."
        fix_label: "Import the standard timings"
        label: "Import the standard timings of season %{id}"
        warnings:
          existing: "The season already has %{count} standard timings: the import adds rows, it never replaces them."
      season_badge_fix:
        title: "Fix the badges of a season"
        description: "Fixes the badges of a whole season one step per run: the sure duplicate merges, then the relay-only badges, then the remaining relay badges (the possible merges only on request, with a team filter). One script per step, each badge in its own transaction. Long: progress and cancel on the run page."
        fix_label: "Fix the season badges"
        label: "Fix the badges of season %{id}"
        label_team: "Fix the badges of team %{team} in season %{id}"
        errors:
          dest_without_src: "needs the source team filter as well"
          possible_without_team: "The 'possible' merges need a source team filter."
        warnings:
          deferred: "%{count} badges touch a badge or a new meeting program already in this step: they are left for the next run."
          failed: "%{count} badges could not be planned (see the failures fact): they are left untouched."
          possible: "Possible merges included: check every pair, they are guesses on similar team names."
      team_check:
        title: "Check a team merge"
        description: "The team merge feasibility report of check:team (the preview of 'Merge teams')."
        fix_label: "Check the team merge"
        label: "Check the merge of team %{source} into %{dest}"
      swimmer_check:
        title: "Check a swimmer merge"
        description: "The swimmer merge feasibility report of check:swimmer (the preview of 'Merge swimmers')."
        fix_label: "Check the swimmer merge"
        label: "Check the merge of swimmer %{source} into %{dest}"
      badge_check:
        title: "Check a badge merge"
        description: "The badge merge (or, without destination, category fix) feasibility report of check:badge (the preview of 'Merge badges')."
        fix_label: "Check the badge merge"
        label: "Check badge %{source} (destination %{dest})"
      season_badges:
        title: "Season badge analysis"
        description: "The season badge analysis of check:season: sure and possible merges, relay badges, team merge hints (the preview of 'Fix the badges of a season')."
        fix_label: "Analyse the season badges"
        label: "Analyse the badges of season %{id}"
      team_map_badges:
        title: "Map the badges of a team"
        description: "The map of check:map_team_badges: for each badge of the team in the season, the categories and teams of the swimmer in the latest seasons (10 per page)."
        fix_label: "Map the team badges"
        label: "Map the badges of team %{team} in season %{season}"
      swimmer_map_mirs:
        title: "Map the results of a swimmer"
        description: "The table of check:map_swimmer_mirs: every individual result of the swimmer with season, badge, team and affiliation."
        fix_label: "Map the swimmer results"
        label: "Map the results of swimmer %{id}"
      team_dup_badges:
        title: "Duplicate badges of a team's swimmers"
        description: "The report of check:dup_badges_for_team: the swimmers ever on the team holding duplicate badges in some season."
        fix_label: "Find duplicate badges"
        label: "Duplicate badges of the swimmers of team %{id}"
      meeting_dup_mir_badges:
        title: "Badges with duplicate results in a meeting"
        description: "The list of check:dup_mir_badges: the badges with more than one individual result in the same program (the season view is the data health check)."
        fix_label: "List the duplicate badges"
        label: "Badges with duplicate results in meeting %{id}"
    rake:
      partial_apply: "--> PARTIAL APPLY: the blocks that ran on the local DB are registered in the Outbox as %{file} (push them as usual); the failed block and the next ones did not run. Fix the cause and re-run: the new dry run plans what is left."
      applied_unregistered: "\r\n*** ERROR: the script RAN on the local DB, but it could not be registered in the SQL Outbox: the change will not reach production by itself. The SQL that ran is kept at %{path}: copy it into crawler/data/results.new/%{folder}/ with a free NNNN- prefix, then Outbox > Rescan disk registers it (if it comes in held 'not applied locally', release it with 'Push without local apply'). Never run it again locally. ***"
      not_written: "\r\n*** ERROR: the script could not be written to the SQL Outbox: nothing was run on the DB. ***"
      nothing_to_do: "\r\nNothing to do: no statement would change any row (no script written)."
      ops_unavailable: "The ops DB is not available (needed for the run history and the Outbox): run bin/rails ops:prepare, then retry."
    lookup:
      placeholder: "Search by name or id…"
      searching: "Searching…"
      none: "No match."
      resolved_unknown: "not found in the local DB"
