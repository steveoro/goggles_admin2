    operations:
      meeting_set_cancelled:
        title: "Segna un meeting annullato"
        description: "Segna il meeting e/o il suo calendario come annullati (rifiutato se il meeting ha risultati). Se il meeting si è svolto ma i risultati non sono mai stati pubblicati, ignora invece la segnalazione con una nota: il sito pubblico lo mostrerebbe come annullato."
        fix_label: "Segna annullato"
        label_meeting: "Segna annullato il meeting %{id}"
        label_calendar: "Segna annullato il calendario %{id}"
        errors:
          no_target: "Indica un meeting o un calendario."
          meeting_not_found: "Meeting %{id} non trovato."
          calendar_not_found: "Calendario %{id} non trovato."
          other_meeting: "Il calendario %{id} non è collegato al meeting %{meeting_id}."
          has_results: "Il meeting ha risultati: non può essere segnato annullato."
      badge_merge:
        title: "Unisci badge"
        description: "Unisce il badge sorgente in quello di destinazione (risultati, vasche, staffettisti, iscrizioni, prenotazioni), oppure corregge un badge da solo su una categoria solo staffette (senza destinazione). Stessa chiamata di merge:badge."
        fix_label: "Unisci badge"
        label: "Unisci il badge %{source} in %{dest}"
        label_fix: "Correggi la categoria del badge %{id}"
        errors:
          checker: "Il controllo dei badge ha riportato errori: imposta force o un'opzione keep_* per proseguire."
      results_dedupe:
        title: "Elimina risultati duplicati"
        description: "Elimina i risultati duplicati di un meeting (risultati individuali, vasche, staffettisti, vasche staffetta, risultati staffetta; resta l'id più basso). Stessa chiamata di check:dup_mir_swimmers autofix=1."
        fix_label: "Elimina duplicati"
        label: "Elimina i risultati duplicati del meeting %{id}"
        errors:
          null_swimmers_first: "Il meeting ha una segnalazione aperta 'nuotatori nulli': correggi prima i nuotatori nulli (l'eliminazione dei duplicati non li trova mai)."
        warnings:
          timing_mismatch: "Alcuni risultati individuali duplicati hanno tempi diversi: l'eliminazione mantiene l'id più basso qualunque sia il tempo."
          groups_capped: "%{count} gruppi duplicati: sono elencati solo i primi."
      results_null_swimmers_fix:
        title: "Correggi i nuotatori nulli nei risultati"
        description: "Ripristina il nuotatore dei risultati individuali e degli staffettisti di un meeting con swimmer_id nullo, a partire dal badge (vasche e vasche staffetta seguono). Stessa chiamata di fix:nil_swimmers_in_results."
        fix_label: "Correggi nuotatori nulli"
        label: "Correggi i nuotatori nulli del meeting %{id}"
        warnings:
          unfixable: "%{count} righe non si possono correggere (senza badge, badge mancante o badge senza nuotatore): sono elencate e mai toccate."
      ranks_recompute:
        title: "Ricalcola le posizioni"
        description: "Ricalcola le posizioni individuali e staffetta di un meeting (o di un'intera stagione) in base ai tempi. Proposto dopo un'eliminazione di duplicati o un'unione di badge, mai concatenato. Stesso codice di recompute:ranks."
        fix_label: "Ricalcola posizioni"
        label_meeting: "Ricalcola le posizioni del meeting %{id}"
        label_season: "Ricalcola le posizioni della stagione %{id}"
        errors:
          no_target: "Indica un meeting o una stagione."
      season_board_backfill:
        title: "Backfill del Season board"
        description: "Collega i calendari della stagione ai loro eventi FIN e segna i meeting con risultati come 'risultati acquisiti', dai file archiviati. Stessa chiamata di season_board:backfill."
        fix_label: "Esegui il backfill"
        label: "Backfill della stagione %{id}"
        warnings:
          no_snapshot: "Non è la stagione del Season board: l'istantanea del monitor FIN non è usata (i calendari sono risolti solo dai file archiviati)."
      swimmer_merge:
        title: "Unisci nuotatori"
        description: "Unisce il nuotatore sorgente in quello di destinazione (badge, risultati, vasche, collegamenti), poi elimina la sorgente. Stessa chiamata di merge:swimmer."
        fix_label: "Unisci nuotatori"
        label: "Unisci il nuotatore %{source} in %{dest}"
        errors:
          checker: "Il controllo dei nuotatori ha riportato errori: imposta force per proseguire."
      team_merge:
        title: "Unisci squadre"
        description: "Unisce la squadra sorgente in quella di destinazione (affiliazioni, badge con le loro unioni, risultati, collegamenti), poi elimina la sorgente. Stessa chiamata di merge:team."
        fix_label: "Unisci squadre"
        label: "Unisci la squadra %{source} in %{dest}"
