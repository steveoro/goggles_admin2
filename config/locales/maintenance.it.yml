        title: "Segna un meeting annullato"
        description: "Segna il meeting e/o il suo calendario come annullati (rifiutato se il meeting ha risultati). Se il meeting si è svolto ma i risultati non sono mai stati pubblicati, ignora invece la segnalazione con una nota: il sito pubblico lo mostrerebbe come annullato."
