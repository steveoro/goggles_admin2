        title: "Backfill del Season board"
        description: "Collega i calendari della stagione ai loro eventi FIN e segna i meeting con risultati come 'risultati acquisiti', dai file archiviati. Stessa chiamata di season_board:backfill."
        fix_label: "Esegui il backfill"
        label: "Backfill della stagione %{id}"
        warnings:
          no_snapshot: "Non è la stagione del Season board: l'istantanea del monitor FIN non è usata (i calendari sono risolti solo dai file archiviati)."
      swimmer_merge:
        title: "Unisci nuotatori"
        description: "Unisce il nuotatore sorgente in quello di destinazione (badge, risultati, vasche, collegamenti), poi elimina la sorgente. Stessa chiamata di merge:swimmer."
        fix_label: "Unisci nuotatori"
        label: "Unisci il nuotatore %{source} in %{dest}"
        errors:
          checker: "Il controllo dei nuotatori ha riportato errori: imposta force per proseguire."
      team_merge:
        title: "Unisci squadre"
        description: "Unisce la squadra sorgente in quella di destinazione (affiliazioni, badge con le loro unioni, risultati, collegamenti), poi elimina la sorgente. Stessa chiamata di merge:team."
        fix_label: "Unisci squadre"
        label: "Unisci la squadra %{source} in %{dest}"
      meeting_merge:
        title: "Fondi meeting"
        description: "Fonde un meeting di origine in uno di destinazione della stessa stagione (sessioni, eventi, programmi, risultati, vasche, staffette, punteggi squadra, calendario), poi cancella l'origine. Stessa chiamata di merge:meeting; dopo l'applicazione si verificano i conteggi attesi e finali."
        fix_label: "Fondi i meeting"
        label: "Fondi il meeting %{source} nel %{dest}"
        errors:
          checker: "Il checker dei meeting ha trovato errori: la fusione non è fattibile."
      meeting_team_fix:
        title: "Correggi una squadra in un meeting"
        description: "Sposta ogni risultato di una squadra sbagliata su quella giusta in un solo meeting (risultati individuali e staffette, vasche, tesserini, doppioni). Stesse chiamate di merge:team_in_1_meeting."
        fix_label: "Correggi la squadra nel meeting"
        label: "Meeting %{meeting}: sposta la squadra %{source} sulla %{dest}"
        warnings:
          badge_pairs: "%{count} nuotatori avranno un tesserino su entrambe le squadre: fondi poi quelle coppie (badge.merge)."
      badge_team_fix:
        title: "Correggi la squadra dei tesserini"
        description: "Imposta la squadra giusta su uno o più tesserini (risultati, vasche e staffette seguono; iscrizioni e prenotazioni vengono cancellate). Rifiutata quando un nuotatore ha già un tesserino sulla squadra giusta: fondi i tesserini invece. Stesse chiamate di fix:team_in_badge."
        fix_label: "Correggi la squadra dei tesserini"
        label: "Tesserini %{badges}: squadra %{team}"
        errors:
          no_badges: "Indica almeno un id di tesserino esistente."
        warnings:
          nuke: "Nuke team attivo: si sposta ogni riga legata a un'affiliazione riusata, non solo questi tesserini."
      badge_swimmer_fix:
        title: "Correggi il nuotatore dei tesserini"
        description: "Imposta il nuotatore giusto su uno o più tesserini (risultati, vasche, frazionisti, iscrizioni e prenotazioni seguono). Rifiutata quando il nuotatore ha già un tesserino per la stessa squadra e stagione: fondi i tesserini invece. Stesse chiamate di fix:swimmer_in_badge."
        fix_label: "Correggi il nuotatore dei tesserini"
        label: "Tesserini %{badges}: nuotatore %{swimmer}"
      meeting_purge:
        title: "Elimina un meeting"
        description: "Cancella ogni riga di un meeting dal basso (risultati, programmi, eventi, sessioni, prenotazioni, punteggi squadra, calendario e la riga del meeting), oppure solo fino ai programmi. Stesse chiamate di purge:meeting."
        fix_label: "Elimina il meeting"
        label: "Elimina il meeting %{id}"
