# Solid Queue processes (run inside Puma via `plugin :solid_queue`, or stand-alone with `bin/jobs`).
# A single worker/thread is plenty for this localhost-only admin app.
default: &default
  dispatchers:
    - polling_interval: 1
      batch_size: 500
  workers:
    - queues: "*"
      threads: 1
      processes: <%= ENV.fetch("JOB_CONCURRENCY", 1) %>
      polling_interval: 1

development:
  <<: *default

test:
  <<: *default

staging:
  <<: *default

production:
  <<: *default
