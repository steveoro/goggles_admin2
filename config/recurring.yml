# Solid Queue recurring tasks (scheduled by the Solid Queue supervisor; see config/queue.yml).
#
# federnuoto_watch: checks the FIN "Riepilogo Eventi" (Supermaster calendar summary) page for changes
# and pushes an alert to any open page of the app. Offset at minute 30 so that it doesn't overlap
# with the stand-alone Python cron watcher (~/Projects/federnuoto_watcher), which runs at minute 0.
default: &default
  federnuoto_watch:
    class: FedernuotoWatchJob
    queue: default
    schedule: every hour at minute 30
  # Season board: daily automatic re-crawl of past meetings still without results
  # (see SeasonRecheckJob; runs on the single-thread 'background' worker)
  season_board_recheck:
    class: SeasonRecheckJob
    queue: background
    schedule: every day at 5:15am

development:
  <<: *default

staging:
  <<: *default

production:
  <<: *default
