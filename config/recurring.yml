# Solid Queue recurring tasks (scheduled by the Solid Queue supervisor; see config/queue.yml).
#
# federnuoto_watch: checks the FIN "Riepilogo Eventi" (Supermaster calendar summary) page for changes
# and pushes an alert to any open page of the app. Offset at minute 30 so that it doesn't overlap
# with the stand-alone Python cron watcher (~/Projects/federnuoto_watcher), which runs at minute 0.
default: &default
  federnuoto_watch:
    class: FedernuotoWatchJob
    queue: default
    schedule: every hour at minute 30
  # Season board: daily automatic re-crawl of past meetings still without results
  # (see SeasonRecheckJob; runs on the single-thread 'background' worker)
  season_board_recheck:
    class: SeasonRecheckJob
    queue: background
    schedule: every day at 5:15am
  # Top bar status pills: read-only refresh of the API ping & crawler status snapshots (ops DB;
  # see SystemStatus::RefreshJob, also enqueued on demand by the status frame when older than 2 minutes)
  system_status_refresh:
    class: SystemStatus::RefreshJob
    queue: default
    schedule: every 5 minutes
  # Dashboard KPI counters: 4 read-only GETs with the background JWT and short timeouts
  # (ops snapshot 'kpi:<api_url>'; see KpiRefreshJob, also enqueued after each sign-in)
  kpi_refresh:
    class: KpiRefreshJob
    queue: default
    schedule: every 15 minutes
  # DB sync: local vs remote DB fingerprints (count, max id, max updated_at of the import tables; read-only
  # queries on both sides, one GET with the background JWT; ops 'db_fingerprints' rows; see DriftCheckJob)
  drift_check:
    class: DriftCheckJob
    queue: default
    schedule: every 30 minutes
  # Data health report heartbeat: decides from the ops 'health_runs' rows which season/group checks are due
  # (current season daily after 06:30, one closed season per heartbeat when older than 7 days) and enqueues the
  # read-only Health::SeasonRunJob checks on the single-thread 'maintenance' worker (see Health::SweepJob)
  health_sweep:
    class: Health::SweepJob
    queue: maintenance
    schedule: every hour at minute 45
  # SQL Outbox: read-only follow-up of the pushed scripts ("sent, not verified"): one GET 'import_queue/:id' per
  # script with the background JWT; returns at once when nothing is 'sent' (see Outbox::RemoteStatusJob)
  outbox_remote_status:
    class: Outbox::RemoteStatusJob
    queue: default
    schedule: every 2 minutes
  # Pipeline automation safety net (phase 10): one SeasonBoard::PipelinePlanner pass on the board season (queues the
  # Data-Fix prepares, phases 1-5 only, and the automatic manifest extractions; never a commit or a push). Does
  # nothing while the automation switch is off (dashboard, or ADMIN2_AUTOMATION=0). See PipelinePlannerJob.
  pipeline_planner:
    class: PipelinePlannerJob
    queue: default
    schedule: every 15 minutes

development:
  <<: *default

staging:
  <<: *default

production:
  <<: *default
